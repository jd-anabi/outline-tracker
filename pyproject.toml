[project]
name = "outline-tracker"
version = "0.2.0.dev0"
description = "Track objects in videos with EdgeTAM; export positions and outline shapes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    # Pinned from the first commit: `uv tool install` ignores uv.lock (SPEC 15), so these pins ARE
    # what students get. Versions = the 2026-10-06 resolution, equal to last week's template lock and
    # last week's `uv run --with torch --with transformers==5.18.0 --with timm` resolution.
    "numpy==2.5.3; python_version >= '3.12'",
    "numpy==2.4.6; python_version < '3.12'",
    "scipy==1.18.1; python_version >= '3.12'",
    "scipy==1.17.1; python_version < '3.12'",
    "pandas==3.0.6",
    "opencv-python-headless==5.0.0.93",
    "imageio-ffmpeg==0.6.0",
    "scikit-image==0.26.0",
    "PySide6-Essentials==6.11.2",
    "pyqtgraph==0.14.0",
    # Upper bound = tested version. Windows and macOS >= 14 resolve to exactly 2.14.1 / 0.29.1.
    # macOS 13 (Apple Silicon) has no wheel newer than torch 2.11.0, which is what `--with torch`
    # gave those laptops last week. For "macOS 14+ only", use "torch==2.14.1" / "torchvision==0.29.1".
    "torch>=2.11.0,<=2.14.1",
    "torchvision>=0.26.0,<=0.29.1",  # already required by timm; listed so the Linux CPU index applies
    "transformers==5.18.0",
    "timm==1.0.30",
    "huggingface_hub==1.33.0",
    "safetensors==0.8.0",
]

[project.scripts]
outline-tracker = "outline_tracker.launch:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outline_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ holds helpers.py and the other helper modules that tests import by name.
pythonpath = ["tests"]
norecursedirs = [".*", "build", "dist"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"
faulthandler_timeout = 120
markers = [
    "slow: real model on short synthetic clips (minutes; not in CI); deselect with -m \"not slow\"",
]

# CPU-only torch on Linux (CI): no CUDA libraries. The marker keeps Windows and macOS on PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
